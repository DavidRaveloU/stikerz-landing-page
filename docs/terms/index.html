<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Términos — Stikerz</title>
  <link rel="stylesheet" href="../assets/css/legal.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
  <main class="container">
    <header class="site-header">
      <div
        style="width:40px;height:40px;background:#c8f04a;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#071; font-weight:700">
        S</div>
      <h1>Stikerz — Términos</h1>
    </header>

    <div id="content" class="prose">
      <p class="meta">Cargando...</p>
    </div>

    <div class="footer-links">
      <a href="/privacy">Política de Privacidad</a>
      <a href="/">Inicio</a>
    </div>
  </main>

  <script>
    (function () {
      // fetch the markdown by relative path (works for GitHub Pages under /repo/)
      fetch('../terms.md').then(r => {
        if (!r.ok) throw new Error('md not found');
        return r.text();
      }).then(md => {
        document.getElementById('content').innerHTML = marked.parse(md);
        const firstEl = document.getElementById('content').querySelector('h1');
        if (firstEl) {
          const article = document.createElement('article');
          article.id = 'terms-article';
          article.innerHTML = document.getElementById('content').innerHTML;
          document.getElementById('content').innerHTML = '';
          document.getElementById('content').appendChild(article);
        }
      }).catch(err => {
        document.getElementById('content').innerHTML = '<p class="meta">No se pudo cargar el contenido.</p>';
        console.error(err);
      });
    })();
  </script>
</body>

</html>
